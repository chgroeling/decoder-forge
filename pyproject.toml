[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decoder-forge"
version = "1.1.1"
description = "A Python tool that generates efficient C++ bit pattern matching algorithms from a simple YAML configuration file."
authors = [
    {name = "Christian Gröling", email = "contact@christiangroeling.de"}
]
requires-python = ">=3.12"
license = "GPL-3.0-only"
readme = "README.md"
dependencies = [
    "click>=8.1.8",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.2",
    "arm-transpiller",
]

[project.scripts]
decoder-forge = "decoder_forge.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F"]

[tool.uv.sources]
arm-transpiller = { git = "https://github.com/chgroeling/arm-transpiller", tag = "v1.1.1" }
